---
layout: page
title: Works
permalink: /works/
---

{% assign works = site.data.projects | sort: "sort_date" | reverse %}
<ol class="works-list">
  {% for entry in works %}
    <li class="work-item" id="{{ entry.id }}">
      <span class="work-year">{{ entry.year }}</span>
      <p class="work-copy">{{ entry.content_html | default: entry.description }}</p>
    </li>
  {% endfor %}
</ol>
