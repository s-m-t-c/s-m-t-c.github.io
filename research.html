---
layout: page
title: Research
permalink: /research/
---

{% assign research = site.data.projects | where: "section", "research" | sort: "sort_date" | reverse %}
<ol class="works-list">
  {% for entry in research %}
    <li class="work-item" id="{{ entry.id }}">
      <span class="work-year">{{ entry.year }}</span>
      <p class="work-copy">{{ entry.content_html | default: entry.description }}</p>
    </li>
  {% endfor %}
</ol>
